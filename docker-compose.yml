version: '3.8'

services:
  nexusvault-app:
    build: .
    container_name: nexusvault_sovereign_node
    ports:
      - "8501:8501"
    volumes:
      - ./nexusvault.db:/app/nexusvault.db
    environment:
      - ENABLE_LIVE_EMAIL=False
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
    restart: unless-stopped